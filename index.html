<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha Multiplayer</title>
<style>
:root { --bg:#1e1e2f; --card:#2a2a40; --cell:#3a3a5c; --text:#fff; --btn:#0066ff; }
.light { --bg:#f2f2f2; --card:#fff; --cell:#ddd; --text:#000; }
body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; position:relative; }
.container { background:var(--card); padding:32px; border-radius:28px; width:95%; max-width:520px; text-align:center; position:relative; }
.developer { position:absolute; top:16px; right:16px; font-size:12px; color:#ccc; }
h2 { font-size:28px; margin-top:0; }
#status { font-size:22px; margin-bottom:14px; }
.board { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:24px 0; position:relative; }
.cell { height:120px; background:var(--cell); border-radius:20px; font-size:48px; font-weight:bold; display:flex; justify-content:center; align-items:center; cursor:pointer; }
.cell.win { background:#00c853; color:white; }
button { width:100%; padding:18px; margin-top:14px; border:none; border-radius:18px; background:var(--btn); color:white; font-size:18px; cursor:pointer; }
.score { font-size:18px; margin-top:18px; }
#multiplayerBtn { position:absolute; top:16px; left:16px; width:120px; padding:8px; font-size:14px; z-index:100; }
#multiplayerMenu { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); padding:24px; border-radius:20px; text-align:center; width:90%; max-width:400px; }
#closeMenuBtn { position:absolute; top:8px; right:8px; background:red; color:white; border:none; border-radius:50%; width:28px; height:28px; font-weight:bold; cursor:pointer; }
#privateRoom { display:none; background:var(--card); padding:24px; border-radius:20px; text-align:center; width:95%; max-width:520px; }
#playerList { margin-top:12px; text-align:left; max-height:120px; overflow-y:auto; background:#333; padding:8px; border-radius:12px; }
.win-line { position:absolute; background:#00c853; transform-origin:left center; height:6px; width:0; animation:drawLine 0.5s forwards; border-radius:3px; z-index:10; }
@keyframes drawLine { from{width:0;} to{width:100%;} }
</style>
<!-- SDK do Parse -->
<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body>

<button id="multiplayerBtn" onclick="openMultiplayerMenu()">Multiplayer</button>

<div class="container" id="mainContainer">
<h2>Jogo da Velha</h2>
<div class="developer">Desenvolvido por Gabriel Morito</div>
<div id="status">Vez do X</div>

<div class="board" id="board">
    <div class="cell" onclick="play(0)"></div>
    <div class="cell" onclick="play(1)"></div>
    <div class="cell" onclick="play(2)"></div>
    <div class="cell" onclick="play(3)"></div>
    <div class="cell" onclick="play(4)"></div>
    <div class="cell" onclick="play(5)"></div>
    <div class="cell" onclick="play(6)"></div>
    <div class="cell" onclick="play(7)"></div>
    <div class="cell" onclick="play(8)"></div>
</div>

<button onclick="toggleMode()">Modo: <span id="mode">2 Jogadores</span></button>
<button id="difficultyBtn" onclick="changeDifficulty()" style="display:none">Dificuldade: <span id="difficulty">Fácil</span></button>
<button onclick="toggleTheme()">Tema Claro / Escuro</button>
<button onclick="reset()">Reiniciar</button>
<div class="score" id="scoreDiv"></div>
</div>

<div id="multiplayerMenu">
<button id="closeMenuBtn" onclick="closeMultiplayerMenu()">X</button>
<h3>Multiplayer</h3>
<input type="text" id="playerNameInput" placeholder="Seu nome" style="width:80%;padding:6px;margin-bottom:12px;">
<button onclick="createRoom()">Criar Sala</button>
<button onclick="joinRoom()">Entrar Sala</button>
</div>

<div id="privateRoom">
<h3>Sala Privada</h3>
<div id="roomStatus">Sala ID: <span id="roomId">-</span></div>
<div class="board" id="privateBoard">
    <div class="cell" onclick="playPrivate(0)"></div>
    <div class="cell" onclick="playPrivate(1)"></div>
    <div class="cell" onclick="playPrivate(2)"></div>
    <div class="cell" onclick="playPrivate(3)"></div>
    <div class="cell" onclick="playPrivate(4)"></div>
    <div class="cell" onclick="playPrivate(5)"></div>
    <div class="cell" onclick="playPrivate(6)"></div>
    <div class="cell" onclick="playPrivate(7)"></div>
    <div class="cell" onclick="playPrivate(8)"></div>
</div>
<div id="playerList">Jogadores:</div>
<div style="margin-top:12px;">
<button id="restartBtn" onclick="restartPrivateGame()" style="display:none;">Reiniciar</button>
<button onclick="leavePrivateRoom()">Sair da Sala</button>
</div>
</div>

<script>
// Inicializar Parse
Parse.initialize("e8nEnz0sw5ezqx09VktYY87vG6DsjP4jhZt9fUbQ", ""); // <-- App ID
Parse.serverURL = 'https://parseapi.back4app.com/';

const status = document.getElementById("status");
const mode = document.getElementById("mode");
const scoreDiv = document.getElementById("scoreDiv");
const mainContainer = document.getElementById("mainContainer");
const multiplayerMenu = document.getElementById("multiplayerMenu");
const privateRoom = document.getElementById("privateRoom");
const roomIdSpan = document.getElementById("roomId");
const restartBtn = document.getElementById("restartBtn");
const playerListDiv = document.getElementById("playerList");
const playerNameInput = document.getElementById("playerNameInput");
const boardCells = Array.from(document.querySelectorAll("#board .cell"));
const privateCells = Array.from(document.querySelectorAll("#privateBoard .cell"));

let board = Array(9).fill("");
let privateBoardArr = Array(9).fill("");
let player = "X";
let gameOver = false;
let vsAI = false;
let lock = false;
let isCreator = false;
let players = [];
let currentDifficulty = 0;
let currentRoom; // Parse object da sala

const wins = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

let score = JSON.parse(localStorage.getItem("score"))||{X:0,O:0,E:0};
updateScore();

// ================= Funções Parse =================
async function createRoom(){
    const roomId = Math.floor(Math.random()*100000).toString();
    roomIdSpan.innerText = roomId;
    isCreator = true;
    privateRoom.style.display = 'block';
    multiplayerMenu.style.display = 'none';
    restartBtn.style.display = 'inline-block';

    const Multiplayer = Parse.Object.extend("Multiplayer");
    const room = new Multiplayer();
    room.set("roomId", roomId);
    room.set("board", Array(9).fill(""));
    room.set("players", [playerNameInput.value||"Player 1"]);
    room.set("turn", "X");
    room.set("status", "em andamento");
    await room.save();

    currentRoom = room;
    subscribeRoom(roomId);
}

async function joinRoom(){
    const id = prompt("Digite o ID da sala:");
    if(!id) return;
    roomIdSpan.innerText = id;
    isCreator = false;
    privateRoom.style.display = 'block';
    multiplayerMenu.style.display = 'none';
    restartBtn.style.display = 'none';

    const query = new Parse.Query("Multiplayer");
    query.equalTo("roomId", id);
    const room = await query.first();
    if(!room){ alert("Sala não encontrada"); return; }

    let pl = room.get("players");
    pl.push(playerNameInput.value||"Player 2");
    room.set("players", pl);
    await room.save();

    currentRoom = room;
    subscribeRoom(id);
}

// Subscrição em tempo real
function subscribeRoom(roomId){
    const query = new Parse.Query("Multiplayer");
    query.equalTo("roomId", roomId);
    const subscription = query.subscribe();
    subscription.on('update', (object) => {
        const data = object.toJSON();
        players = data.players;
        updatePlayerList();
        privateBoardArr = data.board;
        privateBoardArr.forEach((v,i)=>privateCells[i].innerText=v);
        player = data.turn;
        status.innerText = data.status==='em andamento'?`Vez do ${player}`:data.status;
    });
}

// Atualizar jogadores visuais
function updatePlayerList(){ playerListDiv.innerHTML="Jogadores:<br>"+players.join("<br>"); }

// ================= Resto do código offline e AI =================
// (Mesma lógica que você já tinha, não mexe)
function showWinLine(cells, boardType){ /* ... */ }
function play(i){ /* ... */ }
function checkEnd(b,boardType){ /* ... */ }
function saveScore(){ /* ... */ }
function updateScore(){ /* ... */ }
function toggleMode(){ /* ... */ }
function toggleTheme(){ /* ... */ }
function clearWinLines(boardType){ /* ... */ }
function reset(){ /* ... */ }
function changeDifficulty(){ /* ... */ }

// ================= Multiplayer UI =================
function openMultiplayerMenu(){ multiplayerMenu.style.display='block'; mainContainer.style.display='none'; privateRoom.style.display='none'; }
function closeMultiplayerMenu(){ multiplayerMenu.style.display='none'; mainContainer.style.display='flex'; }
function leavePrivateRoom(){
    privateRoom.style.display='none';
    mainContainer.style.display='flex';
    board.fill(""); privateBoardArr.fill("");
    boardCells.forEach(c=>c.innerText=''); privateCells.forEach(c=>c.innerText=''); 
    document.querySelectorAll(".win-line").forEach(l=>l.remove());
    players=[]; updatePlayerList();
    if(currentRoom) currentRoom.destroy(); // remove sala
}
function playPrivate(i){
    if(privateBoardArr[i]||gameOver||!currentRoom) return;
    privateBoardArr[i]=player;
    privateCells[i].innerText=player;

    const nextTurn = player==='X'?'O':'X';
    player = nextTurn;

    // Atualiza no Back4App
    currentRoom.set("board", privateBoardArr);
    currentRoom.set("turn", player);
    currentRoom.save();
}
function restartPrivateGame(){
    if(!isCreator) return;
    privateBoardArr.fill("");
    privateCells.forEach(c=>c.innerText=''); 
    document.querySelectorAll(".win-line").forEach(l=>l.remove());
    gameOver=false;
    if(currentRoom){
        currentRoom.set("board", privateBoardArr);
        currentRoom.set("turn", "X");
        currentRoom.set("status", "em andamento");
        currentRoom.save();
    }
}
</script>
</body>
</html>
