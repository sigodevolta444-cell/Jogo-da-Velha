<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha Pro</title>

<style>
:root {
    --bg: #1e1e2f;
    --card: #2a2a40;
    --cell: #3a3a5c;
    --text: #fff;
    --btn: #0066ff;
}

.light {
    --bg: #f2f2f2;
    --card: #fff;
    --cell: #ddd;
    --text: #000;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: var(--card);
    padding: 32px;
    border-radius: 28px;
    width: 95%;
    max-width: 520px;
    text-align: center;
}

.container {
    position: relative; /* garante que o developer fique relativo ao painel */
}

.developer {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 12px;
    color: #ccc;
}

h2 {
    font-size: 28px;
    margin-top: 0;
}

#status {
    font-size: 22px;
    margin-bottom: 14px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 24px 0;
}

.cell {
    height: 120px;
    background: var(--cell);
    border-radius: 20px;
    font-size: 48px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.cell.win {
    background: #00c853;
    color: white;
}

button {
    width: 100%;
    padding: 18px;
    margin-top: 14px;
    border: none;
    border-radius: 18px;
    background: var(--btn);
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.score {
    font-size: 18px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Jogo da Velha</h2>
    <div id="status">Vez do X</div>

    <div class="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <button onclick="toggleMode()">Modo: <span id="mode">2 Jogadores</span></button>

    <!-- BOTÃO DE DIFICULDADE (SÓ VS IA) -->
    <button id="difficultyBtn" onclick="changeDifficulty()" style="display:none">
        Dificuldade: <span id="difficulty">Fácil</span>
    </button>

    <button onclick="toggleTheme()">Tema Claro / Escuro</button>
    <button onclick="reset()">Reiniciar</button>

    <div class="score" id="scoreDiv"></div>
</div>

<script>
/* ====== ELEMENTOS ====== */
const status = document.getElementById("status");
const mode = document.getElementById("mode");
const scoreDiv = document.getElementById("scoreDiv");
const cells = document.getElementsByClassName("cell");

/* ====== ESTADO ====== */
let board = Array(9).fill("");
let player = "X";
let gameOver = false;
let vsAI = false;
let lock = false;

let difficulties = ["Fácil", "Médio", "Difícil"];
let difficultyIndex = 0;

let score = JSON.parse(localStorage.getItem("score")) || {X:0,O:0,E:0};

const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
];

updateScore();

/* ====== JOGO ====== */
function play(i) {
    if (lock || board[i] || gameOver) return;

    move(i, player);

    if (checkEnd()) return;

    player = player === "X" ? "O" : "X";
    status.innerText = "Vez do " + player;

    if (vsAI && player === "O") {
        lock = true;
        setTimeout(aiMove, 400);
    }
}

function move(i, p) {
    board[i] = p;
    cells[i].innerText = p;
}

function aiMove() {
    let i;

    if (difficulties[difficultyIndex] === "Fácil") {
        i = randomMove();
    } else {
        i = smartMove() ?? randomMove();
    }

    move(i, "O");

    if (checkEnd()) return;

    player = "X";
    status.innerText = "Vez do X";
    lock = false;
}

function randomMove() {
    const empty = board
        .map((v,i)=>v===""?i:null)
        .filter(v=>v!==null);
    return empty[Math.floor(Math.random()*empty.length)];
}

function smartMove() {
    for (let c of wins) {
        const vals = c.map(i => board[i]);
        if (vals.filter(v=>v==="O").length===2 && vals.includes("")) {
            return c[vals.indexOf("")];
        }
    }
    for (let c of wins) {
        const vals = c.map(i => board[i]);
        if (vals.filter(v=>v==="X").length===2 && vals.includes("")) {
            return c[vals.indexOf("")];
        }
    }
    return null;
}

function checkEnd() {
    for (let c of wins) {
        if (c.every(i => board[i] === player)) {
            status.innerText = player + " venceu!";
            score[player]++;
            saveScore();
            highlight(c);
            gameOver = true;
            lock = false;
            return true;
        }
    }

    if (!board.includes("")) {
        status.innerText = "Empate!";
        score.E++;
        saveScore();
        gameOver = true;
        lock = false;
        return true;
    }
    return false;
}

function highlight(cellsWin) {
    cellsWin.forEach(i => cells[i].classList.add("win"));
}

/* ====== CONTROLES ====== */
function reset() {
    board.fill("");
    gameOver = false;
    lock = false;
    player = "X";
    status.innerText = "Vez do X";
    Array.from(cells).forEach(c=>{
        c.innerText="";
        c.classList.remove("win");
    });
}

function toggleMode() {
    vsAI = !vsAI;
    mode.innerText = vsAI ? "Vs Computador" : "2 Jogadores";
    document.getElementById("difficultyBtn").style.display = vsAI ? "block" : "none";
    reset();
}

function changeDifficulty() {
    difficultyIndex = (difficultyIndex + 1) % difficulties.length;
    document.getElementById("difficulty").innerText = difficulties[difficultyIndex];
    reset();
}

function toggleTheme() {
    document.body.classList.toggle("light");
}

/* ====== SCORE ====== */
function saveScore() {
    localStorage.setItem("score", JSON.stringify(score));
    updateScore();
}

function updateScore() {
    scoreDiv.innerText = `X: ${score.X} | O: ${score.O} | Empates: ${score.E}`;
}
</script>

</body>
</html>
