<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha</title>
<style>
:root {
    --bg:#1e1e2f;
    --card:#2a2a40;
    --cell:#3a3a5c;
    --text:#fff;
    --btn:#0066ff;
}
body {
    margin:0;font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;position:relative;
}
.container{
    background:var(--card);padding:32px;border-radius:28px;width:95%;
    max-width:520px;text-align:center;position:relative;
}
#multiplayerBtn{
    position:absolute;top:16px;left:16px;width:120px;padding:8px;font-size:14px;z-index:100;
}
#multiplayerMenu{
    display:none;position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:var(--card);padding:24px;border-radius:20px;text-align:center;width:90%;max-width:400px;
}
#closeMenuBtn{
    position:absolute;top:8px;right:8px;background:red;color:white;border:none;
    border-radius:50%;width:28px;height:28px;font-weight:bold;cursor:pointer;
}
.board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0;
}
.cell{
    height:120px;background:var(--cell);border-radius:20px;
    font-size:48px;font-weight:bold;display:flex;justify-content:center;align-items:center;
    cursor:pointer;
}
.cell.win{background:#00c853;color:white;}
button{
    width:100%;padding:18px;margin-top:14px;border:none;border-radius:18px;background:var(--btn);
    color:white;font-size:18px;cursor:pointer;
}
.score{font-size:18px;margin-top:18px;}
.playerList{margin-top:12px;text-align:left;font-size:14px;}
</style>
<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
</head>
<body>

<!-- Botão Multiplayer -->
<button id="multiplayerBtn" onclick="openMultiplayerMenu()">Multiplayer</button>

<div class="container" id="mainContainer">
    <h2>Jogo da Velha</h2>
    <div class="developer">Desenvolvido por Gabriel Morito</div>
    <div id="status">Vez do X</div>
    <div class="board" id="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>
    <button onclick="toggleMode()">Modo: <span id="mode">2 Jogadores</span></button>
    <button id="difficultyBtn" onclick="changeDifficulty()" style="display:none">Dificuldade: <span id="difficulty">Fácil</span></button>
    <button onclick="toggleTheme()">Tema Claro / Escuro</button>
    <button onclick="reset()">Reiniciar</button>
    <div class="score" id="scoreDiv"></div>
</div>

<!-- Menu Multiplayer -->
<div id="multiplayerMenu">
    <button id="closeMenuBtn" onclick="closeMultiplayerMenu()">X</button>
    <h3>Multiplayer</h3>
    <input type="text" id="playerNameInput" placeholder="Seu nome">
    <button id="createRoomBtn" onclick="createRoom()">Criar Sala</button>
    <button id="joinRoomBtn" onclick="joinRoom()">Entrar Sala</button>
    <div style="margin-top:12px;">Sala ID: <span id="roomId">-</span></div>
    <div id="roomActions" style="display:none;margin-top:16px;">
        <button id="restartBtn" onclick="restartGame()">Reiniciar</button>
        <button onclick="leaveRoom()">Sair da Sala</button>
    </div>
    <div class="playerList" id="playerList"></div>
    <div class="board" id="privateBoard" style="display:none;">
        <div class="cell" onclick="playPrivate(0)"></div>
        <div class="cell" onclick="playPrivate(1)"></div>
        <div class="cell" onclick="playPrivate(2)"></div>
        <div class="cell" onclick="playPrivate(3)"></div>
        <div class="cell" onclick="playPrivate(4)"></div>
        <div class="cell" onclick="playPrivate(5)"></div>
        <div class="cell" onclick="playPrivate(6)"></div>
        <div class="cell" onclick="playPrivate(7)"></div>
        <div class="cell" onclick="playPrivate(8)"></div>
    </div>
</div>

<script>
// === Inicializa Parse ===
Parse.initialize("e8nEnz0sw5ezqx09VktYY87vG6DsjP4jhZt9fUbQ", "GZD0QLNLrVJhhVZ8k9OjkdVrmaWmk9THRuleYfVD");
Parse.serverURL = "https://parseapi.back4app.com/";

// === Variáveis ===
const mainContainer = document.getElementById("mainContainer");
const multiplayerMenu = document.getElementById("multiplayerMenu");
const privateBoard = document.getElementById("privateBoard");
const roomActions = document.getElementById("roomActions");
const playerListDiv = document.getElementById("playerList");
const roomIdSpan = document.getElementById("roomId");
const restartBtn = document.getElementById("restartBtn");
const playerNameInput = document.getElementById("playerNameInput");
const cells = Array.from(document.getElementById("board").children);
const privateCells = Array.from(privateBoard.children);
let board = Array(9).fill("");
let privateBoardArray = Array(9).fill("");
let player = "X";
let gameOver = false;
let lock=false;
let isCreator=false;
let roomId=null;
let playerName="";
let playerSide="X";

// Classe da sala no Parse
const Room = Parse.Object.extend("Room");

// === Funções ===
function openMultiplayerMenu(){
    mainContainer.style.display="none";
    multiplayerMenu.style.display="block";
}

function closeMultiplayerMenu(){
    multiplayerMenu.style.display="none";
    mainContainer.style.display="flex";
}

function createRoom(){
    playerName = playerNameInput.value || "Player";
    const newRoom = new Room();
    const id = Math.floor(Math.random()*100000);
    newRoom.set("roomId", id);
    newRoom.set("board", Array(9).fill(""));
    newRoom.set("players", [{name:playerName, side:"X"}]);
    newRoom.set("turn","X");
    newRoom.set("score",{X:0,O:0,E:0});
    newRoom.save().then(r=>{
        roomId=id;
        roomIdSpan.innerText=roomId;
        isCreator=true;
        playerSide="X";
        showRoomUI();
        startListeningRoom();
    });
}

function joinRoom(){
    playerName = playerNameInput.value || "Player";
    const id = prompt("Digite o ID da sala:");
    if(!id) return;
    const query = new Parse.Query(Room);
    query.equalTo("roomId", parseInt(id));
    query.first().then(r=>{
        if(!r) {alert("Sala não encontrada"); return;}
        roomId=r.get("roomId");
        roomIdSpan.innerText=roomId;
        playerSide="O";
        const players=r.get("players")||[];
        players.push({name:playerName,side:"O"});
        r.set("players",players);
        r.save();
        isCreator=false;
        showRoomUI();
        startListeningRoom();
    });
}

function showRoomUI(){
    createRoomBtn.style.display="none";
    joinRoomBtn.style.display="none";
    roomActions.style.display="block";
    privateBoard.style.display="grid";
    updatePlayerList([]);
    closeMenuBtn.style.display="none";
}

function leaveRoom(){
    multiplayerMenu.style.display="none";
    mainContainer.style.display="flex";
    createRoomBtn.style.display="block";
    joinRoomBtn.style.display="block";
    roomActions.style.display="none";
    privateBoard.style.display="none";
    roomId=null;
}

// === Jogadas ===
function playPrivate(i){
    if(lock || privateBoardArray[i] || gameOver) return;
    privateBoardArray[i]=playerSide;
    privateCells[i].innerText=playerSide;
    updateRoomBoard();
}

// === Atualiza no Parse ===
function updateRoomBoard(){
    const query = new Parse.Query(Room);
    query.equalTo("roomId",parseInt(roomId));
    query.first().then(r=>{
        if(!r) return;
        r.set("board",privateBoardArray);
        r.set("turn", playerSide==="X"?"O":"X");
        r.save();
    });
}

// === Lista de jogadores e escuta mudanças ===
function startListeningRoom(){
    const query = new Parse.Query(Room);
    query.equalTo("roomId",parseInt(roomId));
    const subscription = query.subscribe();
    subscription.on("update", (room)=>{
        privateBoardArray = room.get("board");
        privateBoardArray.forEach((v,i)=>{privateCells[i].innerText=v;});
        updatePlayerList(room.get("players"));
        checkEnd(room.get("board"));
    });
}

function updatePlayerList(players){
    playerListDiv.innerHTML = "<strong>Jogadores:</strong><br>";
    players.forEach(p=>{playerListDiv.innerHTML+=p.name+" ("+p.side+")<br>";});
}

// === Checagem fim de jogo ===
function checkEnd(boardArr){
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let winner=null;
    for(const c of wins){
        if(c.every(i=>boardArr[i]==="X")) winner="X";
        if(c.every(i=>boardArr[i]==="O")) winner="O";
    }
    if(winner){
        alert(winner+" venceu!");
        gameOver=true;
        return;
    }
    if(!boardArr.includes("")){
        alert("Empate!");
        gameOver=true;
    }
}

function restartGame(){
    if(!isCreator) return;
    privateBoardArray.fill("");
    privateCells.forEach(c=>c.innerText="");
    const query = new Parse.Query(Room);
    query.equalTo("roomId",parseInt(roomId));
    query.first().then(r=>{r.set("board",privateBoardArray);r.set("turn","X");r.save();gameOver=false;});
}

// === Funções extras ===
function toggleMode(){/*só local por enquanto*/}

function changeDifficulty(){}

function toggleTheme(){document.body.classList.toggle("light");}

</script>
</body>
</html>
