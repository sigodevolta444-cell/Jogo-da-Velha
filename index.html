<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha Multiplayer</title>
<style>
:root {
    --bg: #1e1e2f;
    --card: #2a2a40;
    --cell: #3a3a5c;
    --text: #fff;
    --btn: #0066ff;
}
.light {
    --bg: #f2f2f2;
    --card: #fff;
    --cell: #ddd;
    --text: #000;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
}
.container {
    background: var(--card);
    padding: 32px;
    border-radius: 28px;
    width: 95%;
    max-width: 520px;
    text-align: center;
    position: relative;
}
.developer {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 12px;
    color: #ccc;
}
h2 { font-size: 28px; margin-top: 0; }
#status { font-size: 22px; margin-bottom: 14px; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; position: relative; }
.cell { height: 120px; background: var(--cell); border-radius: 20px; font-size: 48px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
.cell.win { background: #00c853; color: white; }
button { width: 100%; padding: 18px; margin-top: 14px; border: none; border-radius: 18px; background: var(--btn); color: white; font-size: 18px; cursor: pointer; }
.score { font-size: 18px; margin-top: 18px; }
#multiplayerBtn {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 120px;
    padding: 8px;
    font-size: 14px;
    z-index: 100;
}
#multiplayerMenu {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--card);
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 400px;
}
#closeMenuBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: red;
    color: white;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-weight: bold;
    cursor: pointer;
}
#privateRoom {
    display: none;
    background: var(--card);
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    width: 95%;
    max-width: 520px;
}
#playerList { margin-top: 12px; text-align: left; max-height: 120px; overflow-y: auto; background: #333; padding: 8px; border-radius: 12px; }

/* ======= Linha de Vitória Animada ======= */
.win-line {
    position: absolute;
    background: #00c853;
    transform-origin: left center;
    height: 6px;
    width: 0;
    animation: drawLine 0.5s forwards;
    border-radius: 3px;
    z-index: 10;
}
@keyframes drawLine {
    from { width: 0; }
    to { width: 100%; }
}
</style>
</head>
<body>

<button id="multiplayerBtn" onclick="openMultiplayerMenu()">Multiplayer</button>

<div class="container" id="mainContainer">
    <h2>Jogo da Velha</h2>
    <div class="developer">Desenvolvido por Gabriel Morito</div>
    <div id="status">Vez do X</div>

    <div class="board" id="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <button onclick="toggleMode()">Modo: <span id="mode">2 Jogadores</span></button>
    <button id="difficultyBtn" onclick="changeDifficulty()" style="display:none">
        Dificuldade: <span id="difficulty">Fácil</span>
    </button>
    <button onclick="toggleTheme()">Tema Claro / Escuro</button>
    <button onclick="reset()">Reiniciar</button>

    <div class="score" id="scoreDiv"></div>
</div>

<!-- Menu Multiplayer -->
<div id="multiplayerMenu">
    <button id="closeMenuBtn" onclick="closeMultiplayerMenu()">X</button>
    <h3>Multiplayer</h3>
    <input type="text" id="playerNameInput" placeholder="Seu nome" style="width: 80%; padding: 6px; margin-bottom: 12px;">
    <button id="createRoomBtn" onclick="createRoom()">Criar Sala</button>
    <button id="joinRoomBtn" onclick="joinRoom()">Entrar Sala</button>
</div>

<!-- Sala Privada -->
<div id="privateRoom">
    <h3>Sala Privada</h3>
    <div id="roomStatus">Sala ID: <span id="roomId">-</span></div>
    <div class="board" id="privateBoard">
        <div class="cell" onclick="playPrivate(0)"></div>
        <div class="cell" onclick="playPrivate(1)"></div>
        <div class="cell" onclick="playPrivate(2)"></div>
        <div class="cell" onclick="playPrivate(3)"></div>
        <div class="cell" onclick="playPrivate(4)"></div>
        <div class="cell" onclick="playPrivate(5)"></div>
        <div class="cell" onclick="playPrivate(6)"></div>
        <div class="cell" onclick="playPrivate(7)"></div>
        <div class="cell" onclick="playPrivate(8)"></div>
    </div>
    <div id="playerList">Jogadores:</div>
    <div style="margin-top:12px;">
        <button id="restartBtn" onclick="restartPrivateGame()" style="display:none;">Reiniciar</button>
        <button onclick="leavePrivateRoom()">Sair da Sala</button>
    </div>
</div>

<script>
const status = document.getElementById("status");
const mode = document.getElementById("mode");
const scoreDiv = document.getElementById("scoreDiv");
const mainContainer = document.getElementById("mainContainer");
const multiplayerMenu = document.getElementById("multiplayerMenu");
const privateRoom = document.getElementById("privateRoom");
const roomIdSpan = document.getElementById("roomId");
const restartBtn = document.getElementById("restartBtn");
const playerListDiv = document.getElementById("playerList");
const playerNameInput = document.getElementById("playerNameInput");
const boardCells = Array.from(document.querySelectorAll("#board .cell"));
const privateCells = Array.from(document.querySelectorAll("#privateBoard .cell"));

let board = Array(9).fill("");
let privateBoardArr = Array(9).fill("");
let player = "X";
let gameOver = false;
let vsAI = false;
let lock = false;
let isCreator = false;
let players = [];

const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
];

let score = JSON.parse(localStorage.getItem("score")) || {X:0,O:0,E:0};
updateScore();

// ===== Função da linha de vitória =====
function showWinLine(cells, boardType) {
    const boardDiv = boardType === 'board' ? document.getElementById('board') : document.getElementById('privateBoard');
    const firstCell = boardDiv.children[cells[0]];
    const lastCell = boardDiv.children[cells[2]];

    const line = document.createElement('div');
    line.classList.add('win-line');

    const rect1 = firstCell.getBoundingClientRect();
    const rect2 = lastCell.getBoundingClientRect();
    const boardRect = boardDiv.getBoundingClientRect();

    const x1 = rect1.left + rect1.width/2 - boardRect.left;
    const y1 = rect1.top + rect1.height/2 - boardRect.top;
    const x2 = rect2.left + rect2.width/2 - boardRect.left;
    const y2 = rect2.top + rect2.height/2 - boardRect.top;

    const length = Math.hypot(x2-x1, y2-y1);
    const angle = Math.atan2(y2-y1, x2-x1) * 180/Math.PI;

    line.style.width = length + 'px';
    line.style.transform = `rotate(${angle}deg)`;
    line.style.top = y1 + 'px';
    line.style.left = x1 + 'px';
    boardDiv.appendChild(line);

    // Tornar as 3 células verdes
    cells.forEach(i => boardDiv.children[i].classList.add('win'));
}

// ===================== Jogo offline =====================
function play(i){
    if(lock || board[i] || gameOver) return;

    board[i] = player;
    boardCells[i].innerText = player;

    if(checkEnd(board,'board')) return;

    if(vsAI && player === "X"){ 
        player = "O"; // vez da IA
        status.innerText = "Vez do O";
        setTimeout(aiPlay, 300); // chama IA com atraso de 300ms
    } else {
        player = player==="X"?"O":"X";
        status.innerText = "Vez do "+player;
    }
}
function checkEnd(b, boardType){
    for(let c of wins){
        if(c.every(i=>b[i]===player)){
            status.innerText = player+" venceu!";
            score[player]++;
            saveScore();
            gameOver=true;
            lock=false;
            showWinLine(c, boardType); // anima linha e células verdes
            return true;
        }
    }
    if(!b.includes("")){
        status.innerText="Empate!";
        score.E++;
        saveScore();
        gameOver=true;
        lock=false;
        return true;
    }
    return false;
}

function saveScore(){ localStorage.setItem("score", JSON.stringify(score)); updateScore();}
function updateScore(){ scoreDiv.innerText=`X: ${score.X} | O: ${score.O} | Empates: ${score.E}`;}
function toggleMode(){ vsAI=!vsAI; mode.innerText=vsAI?"Vs Computador":"2 Jogadores"; document.getElementById("difficultyBtn").style.display = vsAI?"block":"none"; reset();}
function toggleTheme(){ document.body.classList.toggle("light"); }

// ===== Reinício completo =====
function clearWinLines(boardType) {
    const boardDiv = boardType === 'board' ? document.getElementById('board') : document.getElementById('privateBoard');
    boardDiv.querySelectorAll('.win-line').forEach(line => line.remove());
}

function reset(){ 
    board.fill(""); 
    privateBoardArr.fill(""); 
    gameOver=false; 
    lock=false; 
    player="X";

    boardCells.forEach(c=>{
        c.innerText=""; 
        c.classList.remove("win");
    });
    privateCells.forEach(c=>{
        c.innerText=""; 
        c.classList.remove("win");
    });

    clearWinLines('board');        // Limpa linha offline
    clearWinLines('privateBoard'); // Limpa linha multiplayer
}
    document.querySelectorAll(".win-line").forEach(line=>line.remove());
    status.innerText = "Vez do X";
}

// ===== Dificuldade =====
    function aiPlay(){
    if(gameOver) return;

    const emptyCells = board.map((v,i) => v === "" ? i : null).filter(i => i !== null);
    if(emptyCells.length === 0) return;

    let choice;
    if(currentDifficulty === 0){ // Fácil: aleatório
        choice = emptyCells[Math.floor(Math.random() * emptyCells.length)];
    } else if(currentDifficulty === 1){ // Médio
        choice = mediumAI(emptyCells);
    } else { // Difícil
        choice = hardAI(emptyCells);
    }

    board[choice] = "O"; // IA sempre joga O
    boardCells[choice].innerText = "O";

    if(checkEnd(board,'board')) return; // checa vitória ou empate

    player = "X"; // volta para o humano
    status.innerText = "Vez do "+player;
}

// Média: tenta vencer, depois bloquear, senão aleatório
function mediumAI(emptyCells){
    for(let i of emptyCells){
        board[i] = "O";
        if(checkEnd(board,'board')){ board[i] = ""; return i; }
        board[i] = "";
    }
    for(let i of emptyCells){
        board[i] = "X";
        if(checkEnd(board,'board')){ board[i] = ""; return i; }
        board[i] = "";
    }
    return emptyCells[Math.floor(Math.random() * emptyCells.length)];
}

// Difícil: usa aleatório como placeholder (você pode implementar Minimax depois)
function hardAI(emptyCells){
    return emptyCells[Math.floor(Math.random() * emptyCells.length)];
}

// Exemplo de função Média (tentativa de bloquear ou ganhar)
function mediumAI(emptyCells){
    // Tenta vencer
    for(let i of emptyCells){
        board[i] = "O";
        if(checkEnd(board, 'board')){ board[i] = ""; return i; }
        board[i] = "";
    }
    // Tenta bloquear X
    for(let i of emptyCells){
        board[i] = "X";
        if(checkEnd(board, 'board')){ board[i] = ""; return i; }
        board[i] = "";
    }
    // Aleatório
    return emptyCells[Math.floor(Math.random() * emptyCells.length)];
}

// Para Difícil você poderia implementar Minimax, se quiser
function hardAI(){ return emptyCells[Math.floor(Math.random() * emptyCells.length)]; }
// ===================== Multiplayer =====================
function openMultiplayerMenu(){ multiplayerMenu.style.display="block"; mainContainer.style.display="none"; privateRoom.style.display="none"; }
function closeMultiplayerMenu(){ multiplayerMenu.style.display="none"; mainContainer.style.display="flex"; }
function createRoom(){
    const id = Math.floor(Math.random()*100000);
    roomIdSpan.innerText = id;
    isCreator=true;
    privateRoom.style.display="block";
    multiplayerMenu.style.display="none";
    restartBtn.style.display="inline-block";
    addPlayer(playerNameInput.value || "Player 1");
}
function joinRoom(){
    const id = prompt("Digite o ID da sala:");
    if(!id) return;
    roomIdSpan.innerText = id;
    isCreator=false;
    privateRoom.style.display="block";
    multiplayerMenu.style.display="none";
    restartBtn.style.display="none";
    addPlayer(playerNameInput.value || "Player 2");
}
function leavePrivateRoom(){
    privateRoom.style.display="none";
    mainContainer.style.display="flex";
    board.fill(""); privateBoardArr.fill("");
    boardCells.forEach(c=>c.innerText=""); privateCells.forEach(c=>c.innerText="");
    document.querySelectorAll(".win-line").forEach(line=>line.remove());
    players=[];
    updatePlayerList();
}
function addPlayer(name){ if(name && !players.includes(name)) players.push(name); updatePlayerList(); }
function updatePlayerList(){ playerListDiv.innerHTML = "Jogadores:<br>"+players.join("<br>"); }
function playPrivate(i){
    if(privateBoardArr[i] || gameOver) return;
    privateBoardArr[i] = player;
    privateCells[i].innerText = player;
    if(checkEnd(privateBoardArr,'privateBoard')) return;
    player = player==="X"?"O":"X";
    status.innerText="Vez do "+player;
}
function restartPrivateGame(){
    if(!isCreator) return;
    privateBoardArr.fill("");
    privateCells.forEach(c=>c.innerText=""); 
    document.querySelectorAll(".win-line").forEach(line=>line.remove());
    gameOver=false;
}
</script>
</body>
</html>
