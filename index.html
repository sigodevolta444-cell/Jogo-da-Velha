<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha Pro</title>

<style>
:root {
    --bg: #1e1e2f;
    --card: #2a2a40;
    --cell: #3a3a5c;
    --text: #fff;
    --btn: #0066ff;
}

.light {
    --bg: #f2f2f2;
    --card: #fff;
    --cell: #ddd;
    --text: #000;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
}

.container {
    background: var(--card);
    padding: 32px;
    border-radius: 28px;
    width: 95%;
    max-width: 520px;
    text-align: center;
    position: relative;
}

h2 {
    font-size: 28px;
    margin-top: 0;
}

#status {
    font-size: 22px;
    margin-bottom: 14px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 24px 0;
}

.cell {
    height: 120px;
    background: var(--cell);
    border-radius: 20px;
    font-size: 48px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.cell.win {
    background: #00c853;
    color: white;
}

/* Botões gerais */
button {
    width: 100%;
    padding: 18px;
    margin-top: 14px;
    border: none;
    border-radius: 18px;
    background: var(--btn);
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* Botão multiplayer pequeno e fixo */
#multiplayerBtn {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 120px;
    padding: 10px;
    font-size: 14px;
    border-radius: 12px;
    z-index: 999;
}

/* Menu multiplayer */
#multiplayerMenu {
    display: none;
    background: var(--card);
    padding: 24px;
    border-radius: 24px;
    text-align: center;
}

#roomId {
    margin-top: 12px;
    font-size: 16px;
    color: #fff;
}

.score {
    font-size: 18px;
    margin-top: 18px;
}

.developer {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 12px;
    color: #ccc;
}
</style>
</head>

<body>

<!-- Botão Multiplayer fixo -->
<button id="multiplayerBtn" onclick="openMultiplayerMenu()">Multiplayer</button>

<div class="container" id="mainContainer">
    <h2>Jogo da Velha</h2>
    <div class="developer">Desenvolvido por Gabriel Morito</div>
    <div id="status">Vez do X</div>

    <div class="board" id="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <div id="gameMenu">
        <button onclick="toggleMode()">Modo: <span id="mode">2 Jogadores</span></button>
        <button id="difficultyBtn" onclick="changeDifficulty()" style="display:none">
            Dificuldade: <span id="difficulty">Fácil</span>
        </button>
        <button onclick="toggleTheme()">Tema Claro / Escuro</button>
        <button onclick="reset()">Reiniciar</button>
    </div>

    <!-- Menu Multiplayer -->
    <div id="multiplayerMenu">
        <button onclick="createRoom()">Criar Partida</button>
        <button onclick="joinRoom()">Entrar Partida</button>
        <div id="roomId"></div>
        <button onclick="resetRoom()" id="resetRoomBtn" style="display:none">Reiniciar</button>
        <button onclick="exitRoom()" id="exitRoomBtn" style="display:none">Sair da Sala</button>
    </div>

    <div class="score" id="scoreDiv"></div>
</div>

<script>
/* ===== ELEMENTOS ===== */
const status = document.getElementById("status");
const mode = document.getElementById("mode");
const scoreDiv = document.getElementById("scoreDiv");
const cells = document.getElementsByClassName("cell");
const gameMenu = document.getElementById("gameMenu");
const multiplayerMenu = document.getElementById("multiplayerMenu");
const roomIdDisplay = document.getElementById("roomId");
const resetRoomBtn = document.getElementById("resetRoomBtn");
const exitRoomBtn = document.getElementById("exitRoomBtn");

/* ===== ESTADO ===== */
let board = Array(9).fill("");
let player = "X";
let gameOver = false;
let vsAI = false;
let lock = false;
let difficulties = ["Fácil", "Médio", "Difícil"];
let difficultyIndex = 0;
let score = JSON.parse(localStorage.getItem("score")) || {X:0,O:0,E:0};

/* Multiplayer */
let inRoom = false;
let currentRoomId = "";

/* ===== FUNÇÕES ===== */
function play(i){
    if(lock || board[i] || gameOver) return;
    move(i, player);
    if(checkEnd()) return;
    player = player === "X" ? "O" : "X";
    status.innerText = "Vez do " + player;
}

function move(i,p){ board[i]=p; cells[i].innerText=p; }

function checkEnd(){
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(let c of wins){
        if(c.every(i=>board[i]===player)){
            status.innerText = player+" venceu!";
            score[player]++; saveScore();
            c.forEach(i=>cells[i].classList.add("win"));
            gameOver=true; lock=false;
            return true;
        }
    }
    if(!board.includes("")){
        status.innerText="Empate!"; score.E++; saveScore();
        gameOver=true; lock=false; return true;
    }
    return false;
}

function reset(){
    board.fill(""); gameOver=false; lock=false; player="X";
    Array.from(cells).forEach(c=>{ c.innerText=""; c.classList.remove("win"); });
    status.innerText = "Vez do X";
}

/* ===== MENU ===== */
function toggleMode(){
    vsAI = !vsAI;
    mode.innerText = vsAI ? "Vs Computador":"2 Jogadores";
    document.getElementById("difficultyBtn").style.display = vsAI?"block":"none";
    reset();
}

function changeDifficulty(){
    difficultyIndex = (difficultyIndex+1)%difficulties.length;
    document.getElementById("difficulty").innerText=difficulties[difficultyIndex];
    reset();
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

/* ===== SCORE ===== */
function saveScore(){ localStorage.setItem("score",JSON.stringify(score)); updateScore();}
function updateScore(){ scoreDiv.innerText=`X: ${score.X} | O: ${score.O} | Empates: ${score.E}`;}

/* ===== MULTIPLAYER ===== */
function openMultiplayerMenu(){
    gameMenu.style.display="none";
    multiplayerMenu.style.display="block";
}

function createRoom(){
    inRoom = true;
    currentRoomId = "ROOM-"+Math.floor(Math.random()*9000+1000);
    roomIdDisplay.innerText = "ID da Sala: "+currentRoomId;
    resetRoomBtn.style.display="block";
    exitRoomBtn.style.display="block";
}

function joinRoom(){
    const id = prompt("Digite o ID da sala:");
    if(id){
        inRoom=true; currentRoomId=id;
        roomIdDisplay.innerText="Entrou na Sala: "+id;
        resetRoomBtn.style.display="block";
        exitRoomBtn.style.display="block";
    }
}

function resetRoom(){
    reset();
}

function exitRoom(){
    inRoom=false; currentRoomId="";
    multiplayerMenu.style.display="none";
    gameMenu.style.display="block";
    roomIdDisplay.innerText="";
    resetRoomBtn.style.display="none";
    exitRoomBtn.style.display="none";
    reset();
}
</script>

</body>
</html>
